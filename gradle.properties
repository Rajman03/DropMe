android.useAndroidX=true

# AGP 8.3.2 nie zna jeszcze compileSdk 36, ale buduje z nim poprawnie - wyciszamy ostrzeżenie.
android.suppressUnsupportedCompileSdk=36

# Moduły funkcyjne korzystają ze wspólnych zasobów (:core) - kolorów i drawable.
# Wymaga to transytywnych klas R, żeby w każdym module działało zwykłe "R.drawable.*".
android.nonTransitiveRClass=false

# Cache wyników: kolejne budowania są znacznie szybsze.
org.gradle.caching=true

# Środowisko bez /proc: wyłączamy daemon, zachowujemy równoległość
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.workers.max=4
